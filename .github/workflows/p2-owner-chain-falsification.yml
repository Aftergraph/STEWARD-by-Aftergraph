name: P2 owner evidence manifest

on:
  pull_request:
    paths:
      - "evidence/p2-owner-evidence-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate owner evidence manifest
        run: python scripts/p2_owner_chain_falsification.py evidence/p2-owner-evidence-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2-owner-evidence-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/p2-owner-evidence-manifest.json
          if-no-files-found: error
