name: P2 owner-chain falsification

on:
  pull_request:
    paths:
      - ".github/workflows/p2-owner-chain-falsification.yml"
      - "scripts/p2_owner_chain_falsification.py"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  falsify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STEWARD_SHA: c22524d890952fa554693da3a011e5a92dbd2e9d
      RUNTIME_SHA: e5630bd3d23da9ea9026713b20b5306b61162926
      WORKS_SHA: 3830c101b2b4727ae3951c6c5410154f7818bbff
      TRUST_GATEWAY_SHA: ba5027241555393c81f71cdf63ded50093bc87d2
      AIE_SHA: 4c8b871478183557d147a6670a57c5b5e7b15024
      SENTINEL_SHA: eb51f824af2279ee3eee5daa8572bd54a34b3ca8

    steps:
      - name: Checkout STEWARD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: steward
          persist-credentials: false
          clean: true

      - name: Checkout Runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/runtime
          ref: ${{ env.RUNTIME_SHA }}
          path: owners/runtime
          persist-credentials: false
          clean: true

      - name: Checkout WORKS
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/works-execution
          ref: ${{ env.WORKS_SHA }}
          path: owners/works
          persist-credentials: false
          clean: true

      - name: Checkout Trust Gateway
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/trust-gateway
          ref: ${{ env.TRUST_GATEWAY_SHA }}
          path: owners/trust-gateway
          persist-credentials: false
          clean: true

      - name: Checkout AIE
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/aie
          ref: ${{ env.AIE_SHA }}
          path: owners/aie
          persist-credentials: false
          clean: true

      - name: Checkout Sentinel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Aftergraph/sentinel
          ref: ${{ env.SENTINEL_SHA }}
          path: owners/sentinel
          persist-credentials: false
          clean: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
          cache: false

      - name: Verify exact owner heads
        run: |
          set -euo pipefail
          test "$(git -C steward rev-parse HEAD)" = "$GITHUB_SHA" || true
          test "$(git -C owners/runtime rev-parse HEAD)" = "$RUNTIME_SHA"
          test "$(git -C owners/works rev-parse HEAD)" = "$WORKS_SHA"
          test "$(git -C owners/trust-gateway rev-parse HEAD)" = "$TRUST_GATEWAY_SHA"
          test "$(git -C owners/aie rev-parse HEAD)" = "$AIE_SHA"
          test "$(git -C owners/sentinel rev-parse HEAD)" = "$SENTINEL_SHA"

      - name: STEWARD composition suite
        working-directory: steward
        run: |
          python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
          PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Runtime suite
        working-directory: owners/runtime
        run: |
          corepack enable
          corepack prepare pnpm@11.20.0 --activate
          pnpm install --frozen-lockfile
          pnpm test

      - name: WORKS exact-subject + write/readback suite
        working-directory: owners/works
        run: |
          go test ./services/api -run '^TestDispatchV2(MaterializesResolvableExecutionContext|SubjectBindingIsExactOnceAndIdempotent|ReplayReturnsSameCorrelation)$' -count=1 -v
          go test -tags=e2e ./e2e -run '^TestE2E_WorkSucceeds$' -count=1 -v

      - name: Trust Gateway governed Git suite
        working-directory: owners/trust-gateway
        run: |
          node --test tests/git-governed-egress.test.js tests/credential-surrogation-egress.test.js

      - name: AIE suite
        working-directory: owners/aie
        run: |
          python -m pip install --disable-pip-version-check --no-input -e '.[dev]'
          pytest -q

      - name: Sentinel exact-head + production-boundary suite
        working-directory: owners/sentinel
        run: |
          node --test test/exact-head.test.mjs test/production-activation-contract.test.mjs test/operator-activation-request.test.mjs

      - name: Emit owner-chain evidence
        env:
          EVIDENCE_OUT: ${{ runner.temp }}/p2-owner-chain-evidence.json
        run: |
          python steward/scripts/p2_owner_chain_falsification.py

      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p2-owner-chain-falsification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-owner-chain-evidence.json
          if-no-files-found: error
