name: steward-spec-validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned validation dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt
      - name: Validate machine-readable contracts
        run: python scripts/validate_repo.py
      - name: Run contract and invariant tests
        run: python -m unittest discover -s tests -v
      - name: Run P1 reference proof
        run: python scripts/run_p1_reference.py
      - name: Verify repository object database
        run: git fsck --full
