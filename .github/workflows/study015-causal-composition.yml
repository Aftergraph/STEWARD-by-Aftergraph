name: STUDY-015 Causal Composition Probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile causal composition surface
        run: python -m compileall -q src scripts/study015_causal_probe.py
      - name: Run exact-head causal composition probe
        run: |
          set -euo pipefail
          python scripts/study015_causal_probe.py > study015-causal-composition.json
          python - <<'PY'
          import json, subprocess
          r=json.load(open('study015-causal-composition.json', encoding='utf-8'))
          head=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert r['schema']=='study015.causal-composition/1.0'
          assert r['source_head']==head
          assert r['network_used'] is False
          assert all(r['seams'].values())
          assert all(r['hostile'].values())
          print('STUDY015_CAUSAL_COMPOSITION=PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: study015-causal-composition-${{ github.event.pull_request.head.sha || github.sha }}
          path: study015-causal-composition.json
          if-no-files-found: error
          retention-days: 14
