name: governed-mission

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mission_note:
        description: "Optional note recorded in the mission evidence"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: governed-mission
  cancel-in-progress: false

jobs:
  mission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-dev.txt

      - name: Validate contracts before any mission
        run: python scripts/validate_repo.py

      - name: Run full test suite
        run: python -m unittest discover -s tests

      - name: Mint WORKS correlation for this mission (deployment plane)
        run: |
          python - <<'PY'
          import json, secrets
          correlation = {
              "execution_context_id": f"ctx_{secrets.token_hex(16)}",
              "trace_id": f"trc_{secrets.token_hex(16)}",
              "minted_by": "works-execution",
              "mission_note": "${{ github.event.inputs.mission_note || github.event.head_commit.message }}",
          }
          with open('mission-correlation.json', 'w') as f:
              json.dump(correlation, f, indent=2)
          print(f"CORRELATION_MINTED=ctx-id-length={len(correlation['execution_context_id'])}")
          PY

      - name: Run autonomous governed mission
        run: |
          set +e
          python scripts/run_governed_mission.py \
            --correlation mission-correlation.json \
            --evidence-out mission-evidence.json
          status=$?
          if [ $status -eq 0 ]; then
            echo "GOVERNED_MISSION=ACCEPTED"
          elif [ $status -eq 1 ]; then
            echo "GOVERNED_MISSION=NOT_ACCEPTED (fail-closed refusal recorded as evidence)"
          else
            echo "GOVERNED_MISSION=REFUSED_TO_START"
            exit $status
          fi

      - name: Assert evidence bundle structure
        run: |
          python - <<'PY'
          import json
          bundle = json.load(open('mission-evidence.json'))
          assert bundle['schema_version'] == 'steward.mission-workflow/1.0'
          assert bundle['works_correlation']['execution_context_id'].startswith('ctx_')
          assert bundle['works_correlation']['trace_id'].startswith('trc_')
          assert bundle['works_correlation']['minted_by'] == 'works-execution'
          assert isinstance(bundle['workflow_steps'], list) and len(bundle['workflow_steps']) >= 1
          assert isinstance(bundle['audit_trace'], list) and len(bundle['audit_trace']) >= 1
          seqs = [s['step'] for s in bundle['workflow_steps']]
          assert seqs == sorted(seqs), 'workflow steps must be ordered'
          outcome = bundle['outcome']
          assert outcome['accepted'] is True, 'mission must reach greenlight on main'
          print(f"EVIDENCE=BUNDLE_OK accepted={outcome['accepted']} result_sha={outcome['result_sha'][:12]}")
          PY

      - name: Upload mission evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4
        with:
          name: mission-evidence
          path: mission-evidence.json
          if-no-files-found: warn
